<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>真果鉴 · 服务</title>
<style>
:root { color-scheme: dark; --bg:#101216; --panel:#181b21; --line:#262a32; --text:#e8eaee; --muted:#98a0ad; --accent:#ff765f; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; background:rgba(16,18,22,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(6px); }
.brand { font-weight:800; letter-spacing:.5px; margin-right:6px; }
.brand span { color:var(--accent); }
select,input,button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
button { cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#1a1207; font-weight:700; }
button:disabled { opacity:.5; cursor:default; }
input#query { flex:1 1 160px; min-width:120px; }
.badge { color:var(--muted); font-size:12px; border:1px solid var(--line); border-radius:999px; padding:3px 9px; }
main { padding:14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
.card:hover { border-color:var(--accent); }
.card h3 { margin:0; font-size:15px; }
.card p { margin:0; color:var(--muted); font-size:13px; }
.poster { width:100%; aspect-ratio:2/3; border-radius:8px; background:#0c0e11; object-fit:cover; display:block; }
.episodes { display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px; margin:12px 0; }
.episode { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 4px; text-align:center; cursor:pointer; font-size:14px; }
.episode:hover { border-color:var(--accent); }
.episode.vip { color:#ffd479; }
.detail { display:flex; gap:14px; align-items:flex-start; }
.detail .poster { width:160px; flex:0 0 160px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.muted { color:var(--muted); }
.player { width:100%; background:#000; border-radius:12px; max-height:70vh; aspect-ratio:16/9; }
.jobs { display:flex; flex-direction:column; gap:8px; }
.job { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.job .row { margin:0; }
.job h4 { margin:0; font-size:15px; }
.bar { height:4px; border-radius:2px; background:#242830; overflow:hidden; margin:6px 0; }
.bar i { display:block; height:100%; background:var(--accent); }
.status { position:fixed; left:14px; right:14px; bottom:14px; padding:10px 12px; border-radius:10px; background:#2a1512; border:1px solid #5b2b23; color:#ffd9d1; display:none; white-space:pre-wrap; }
.status.show { display:block; }
.spinner { color:var(--muted); padding:14px; }
.back { margin-bottom:10px; }
dialog { border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text); padding:18px; max-width:380px; }
dialog::backdrop { background:rgba(0,0,0,.6); }
dialog input { width:100%; margin:10px 0; }
h2 { margin:0 0 6px; font-size:19px; }
</style>
</head>
<body>
<header>
  <div class="brand">真果鉴<span>·服务</span></div>
  <select id="source" title="站源"></select>
  <input id="query" placeholder="搜索剧名" autocomplete="off">
  <button id="search" class="primary">搜索</button>
  <button id="home">首页</button>
  <button id="downloads-button">下载</button>
  <button id="token-button" hidden>令牌</button>
  <span id="proxy-badge" class="badge" hidden></span>
</header>
<main id="view"><div class="spinner">加载中…</div></main>
<div id="status" class="status"></div>
<dialog id="token-dialog">
  <h2>访问令牌</h2>
  <p class="muted">服务已启用 TOKEN，请在下方填入相同令牌；只保存在本机浏览器。</p>
  <input id="token-input" type="password" placeholder="Bearer 令牌">
  <div class="row" style="margin:0">
    <button id="token-save" class="primary">保存</button>
    <button id="token-clear">清除</button>
  </div>
</dialog>
<video id="player" class="player" style="display:none" controls playsinline></video>
<script src="/hls.min.js"></script>
<script>
const state = { source:'', query:'', page:1, hasMore:false, items:[], drama:null, chapters:[], index:0, plan:null, hls:null, loading:false, jobs:[], timer:null };
const view = document.getElementById('view');
const sourceSelect = document.getElementById('source');
const queryInput = document.getElementById('query');
const statusBox = document.getElementById('status');
const player = document.getElementById('player');
const proxyBadge = document.getElementById('proxy-badge');
let sequence = 0;
let authRequired = false;

const labels = { queued:'等待下载', downloading:'正在下载', paused:'已暂停', failed:'下载失败', completed:'已下载', removing:'正在取消' };
const token = () => localStorage.getItem('zgj-token') || '';
const authHeaders = () => (token() ? {Authorization:'Bearer ' + token()} : {});
const withToken = (url) => token() ? url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token()) : url;

function showStatus(message) { statusBox.textContent = message || ''; statusBox.classList.toggle('show', Boolean(message)); }

async function api(path, options) {
  const response = await fetch(path, Object.assign({headers:authHeaders()}, options || {}));
  if (response.status === 401) { askToken(); throw new Error('访问令牌无效或缺失'); }
  const payload = await response.json();
  if (!payload.ok) throw new Error(payload.error || '请求失败');
  return payload.data;
}

const call = (body) => api('/api/request', { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body:JSON.stringify(body) });

function askToken() { document.getElementById('token-dialog').showModal(); }

function coverUrl(drama) { return withToken('/api/cover?drama=' + encodeURIComponent(JSON.stringify(drama))); }
function localUrl(drama, index) { return withToken('/local?drama=' + encodeURIComponent(JSON.stringify(drama)) + '&index=' + index); }

async function loadSources() {
  const data = await api('/api/sources');
  sourceSelect.innerHTML = '';
  for (const item of data.items) {
    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = item.name;
    sourceSelect.appendChild(option);
  }
  state.source = data.items.length ? data.items[0].id : '';
}

async function loadCatalog(append) {
  if (!state.source || state.loading) return;
  stopTimer();
  state.loading = true;
  if (!append) { state.page = 1; state.items = []; view.innerHTML = '<div class="spinner">加载中…</div>'; }
  try {
    const data = await call({ action:'catalog', source:state.source, category:'', query:state.query, page:state.page });
    state.items = append ? state.items.concat(data.items) : data.items;
    state.hasMore = Boolean(data.hasMore);
    if (data.warning) showStatus(data.warning);
    renderCatalog();
  } catch (error) {
    showStatus('目录加载失败：' + (error.message || error));
    if (!append) view.innerHTML = '<div class="spinner">目录加载失败</div>';
  } finally { state.loading = false; }
}

function poster(drama, className) {
  const image = document.createElement('img');
  image.className = className || 'poster';
  image.loading = 'lazy';
  image.alt = drama.title || '';
  image.src = coverUrl(drama);
  image.onerror = () => { image.style.display = 'none'; };
  return image;
}

function renderCatalog() {
  view.innerHTML = '';
  if (!state.items.length) { view.innerHTML = '<div class="spinner">没有结果</div>'; return; }
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const drama of state.items) {
    const card = document.createElement('div');
    card.className = 'card';
    const title = document.createElement('h3');
    title.textContent = drama.title || drama.id;
    const meta = document.createElement('p');
    meta.textContent = [drama.category, drama.episodes ? drama.episodes + ' 集' : '', drama.vip ? 'VIP' : ''].filter(Boolean).join(' · ');
    card.append(poster(drama), title, meta);
    card.onclick = () => openDetail(drama);
    grid.appendChild(card);
  }
  view.appendChild(grid);
  if (state.hasMore) {
    const more = document.createElement('button');
    more.textContent = '加载更多';
    more.style.marginTop = '12px';
    more.onclick = () => { state.page += 1; loadCatalog(true); };
    view.appendChild(more);
  }
}

async function openDetail(drama) {
  stopPlayback();
  stopTimer();
  state.drama = drama;
  view.innerHTML = '<div class="spinner">读取剧集…</div>';
  try {
    const data = await call({ action:'detail', drama });
    state.chapters = data.chapters || [];
    state.detail = data.drama || drama;
    renderDetail();
  } catch (error) {
    showStatus('详情加载失败：' + (error.message || error));
    view.innerHTML = '<div class="spinner">详情加载失败</div>';
  }
}

function renderDetail() {
  view.innerHTML = '';
  const drama = state.detail || state.drama;
  const back = document.createElement('button');
  back.textContent = '← 返回列表';
  back.className = 'back';
  back.onclick = () => { stopPlayback(); renderCatalog(); };

  const head = document.createElement('div');
  head.className = 'detail';
  const info = document.createElement('div');
  const title = document.createElement('h2');
  title.textContent = drama.title || '';
  const meta = document.createElement('p');
  meta.className = 'muted';
  meta.textContent = [state.chapters.length + ' 集', drama.category, drama.description].filter(Boolean).join(' · ');
  const tools = document.createElement('div');
  tools.className = 'row';
  const downloadAll = document.createElement('button');
  downloadAll.className = 'primary';
  downloadAll.textContent = '下载全部';
  downloadAll.onclick = () => enqueue(state.chapters.map((chapter, position) => ({ chapter, number:episodeNumber(chapter, position) })));
  const refresh = document.createElement('button');
  refresh.textContent = '更新剧集信息';
  refresh.onclick = () => call({ action:'sourceJob', source:drama.source || state.source, command:'update', drama })
    .then(() => openDetail(drama)).catch((error) => showStatus('更新失败：' + error.message));
  tools.append(downloadAll, refresh);
  info.append(title, meta, tools);
  head.append(poster(drama), info);

  const episodes = document.createElement('div');
  episodes.className = 'episodes';
  state.chapters.forEach((chapter, position) => {
    const button = document.createElement('div');
    button.className = 'episode' + (chapter.vip ? ' vip' : '') + (position === state.index ? ' current' : '');
    button.textContent = (chapter.title || '第 ' + episodeNumber(chapter, position) + ' 集') + (chapter.vip ? ' · VIP' : '');
    button.onclick = () => playEpisode(position);
    episodes.appendChild(button);
  });
  view.append(back, head, episodes);
}

function episodeNumber(chapter, position) {
  const value = Number(chapter.currentEpisode);
  return value > 0 ? value : position + 1;
}

async function enqueue(entries) {
  if (!entries.length) return;
  try {
    const data = await call({ action:'enqueueDownloads', drama:state.detail || state.drama, quality:0, entries: entries.map((entry) => ({ chapter:entry.chapter, index:entry.number })) });
    showStatus('已加入 ' + (data.added || 0) + ' 集下载任务');
  } catch (error) {
    showStatus('加入下载失败：' + (error.message || error));
  }
}

async function playEpisode(position) {
  const chapter = state.chapters[position];
  if (!chapter) return;
  state.index = position;
  showStatus('');
  player.style.display = 'block';
  try {
    const plan = await call({ action:'resolve', drama:state.detail || state.drama, chapter, index:episodeNumber(chapter, position), quality:0, sequence:++sequence });
    state.plan = plan;
    attach(plan.url);
    renderPlayerBar(position);
    renderDetail();
  } catch (error) {
    player.style.display = 'none';
    showStatus('播放失败：' + (error.message || error));
  }
}

function attach(url) {
  if (state.hls) { state.hls.destroy(); state.hls = null; }
  const isHls = /\.m3u8(\?|$)/.test(url);
  if (isHls && window.Hls && window.Hls.isSupported()) {
    state.hls = new window.Hls({ lowLatencyMode:false });
    state.hls.loadSource(url);
    state.hls.attachMedia(player);
    state.hls.on(window.Hls.Events.ERROR, (_, data) => { if (data && data.fatal) showStatus('播放出错：' + data.details); });
  } else {
    player.src = url;
  }
  player.play().catch(() => {});
}

function renderPlayerBar(position) {
  const bar = document.getElementById('player-bar') || document.createElement('div');
  bar.id = 'player-bar';
  bar.className = 'row';
  bar.innerHTML = '';
  const label = document.createElement('span');
  label.textContent = state.chapters[position] ? (state.chapters[position].title || '第 ' + episodeNumber(state.chapters[position], position) + ' 集') : '';
  const previous = document.createElement('button');
  previous.textContent = '上一集';
  previous.disabled = position <= 0;
  previous.onclick = () => playEpisode(position - 1);
  const next = document.createElement('button');
  next.textContent = '下一集';
  next.disabled = position >= state.chapters.length - 1;
  next.onclick = () => playEpisode(position + 1);
  const download = document.createElement('button');
  download.textContent = '下载本集';
  download.onclick = () => enqueue([{ chapter:state.chapters[position], number:episodeNumber(state.chapters[position], position) }]);
  const back = document.createElement('button');
  back.textContent = '返回选集';
  back.onclick = () => { stopPlayback(); renderDetail(); };
  bar.append(label, previous, next, download, back);
  player.insertAdjacentElement('afterend', bar);
}

function stopPlayback() {
  if (state.hls) { state.hls.destroy(); state.hls = null; }
  player.pause();
  player.removeAttribute('src');
  player.load();
  player.style.display = 'none';
  const bar = document.getElementById('player-bar');
  if (bar) bar.remove();
  if (state.plan && state.plan.session) call({ action:'release', session:state.plan.session }).catch(() => {});
  state.plan = null;
}

function stopTimer() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
}

async function openDownloads() {
  stopPlayback();
  try {
    await refreshDownloads();
    state.timer = setInterval(refreshDownloads, 3000);
  } catch (error) {
    showStatus('下载列表加载失败：' + (error.message || error));
  }
}

async function refreshDownloads() {
  const data = await api('/api/downloads');
  state.jobs = data.jobs || [];
  renderDownloads();
}

function jobRow(job) {
  const box = document.createElement('div');
  box.className = 'job';
  const title = document.createElement('h4');
  title.textContent = (job.drama && job.drama.title ? job.drama.title : '') + ' · 第 ' + (job.index || (job.chapter && job.chapter.currentEpisode) || '?') + ' 集';
  const meta = document.createElement('p');
  meta.className = 'muted';
  const bytes = job.total > 0 ? Math.round(job.bytes / 1048576) + ' / ' + Math.round(job.total / 1048576) + ' MB' : '';
  meta.textContent = [labels[job.state] || job.state, bytes, job.actualQuality ? job.actualQuality + 'P' : '', job.error || ''].filter(Boolean).join(' · ');
  const bar = document.createElement('div');
  bar.className = 'bar';
  const fill = document.createElement('i');
  fill.style.width = Math.max(0, Math.min(100, Math.round((job.progress || 0) * 100))) + '%';
  bar.appendChild(fill);
  const tools = document.createElement('div');
  tools.className = 'row';
  if (job.state === 'queued' || job.state === 'downloading') {
    tools.appendChild(jobButton('暂停', () => control('pause', job)));
  }
  if (job.state === 'paused' || job.state === 'failed') {
    tools.appendChild(jobButton('继续 / 重试', () => control('resume', job)));
  }
  if (job.state === 'completed') {
    tools.appendChild(jobButton('本地播放', () => playLocal(job)));
  }
  tools.appendChild(jobButton('删除', () => control('remove', job, true)));
  box.append(title, meta, bar, tools);
  return box;
}

function jobButton(label, action) {
  const button = document.createElement('button');
  button.textContent = label;
  button.onclick = action;
  return button;
}

async function control(command, job, confirmFirst) {
  if (confirmFirst && !window.confirm('删除该下载及其文件？')) return;
  try {
    await call({ action:'controlDownloads', jobId:job.id, command });
    await refreshDownloads();
  } catch (error) {
    showStatus('操作失败：' + (error.message || error));
  }
}

function playLocal(job) {
  state.drama = job.drama;
  state.detail = job.drama;
  state.chapters = [job.chapter || { currentEpisode: job.index }];
  state.index = 0;
  player.style.display = 'block';
  attach(localUrl(job.drama, job.index || episodeNumber(job.chapter || {}, 0)));
  renderPlayerBar(0);
  showStatus('本地播放：' + (labels[job.state] || job.state));
}

function renderDownloads() {
  view.innerHTML = '';
  const back = document.createElement('button');
  back.textContent = '← 返回列表';
  back.className = 'back';
  back.onclick = () => { stopTimer(); renderCatalog(); };
  const tools = document.createElement('div');
  tools.className = 'row';
  tools.append(
    jobButton('全部暂停', () => batch('pause')),
    jobButton('全部继续', () => batch('resume')),
    jobButton('清理已完成', () => batch('archive')),
    jobButton('刷新', () => refreshDownloads().catch((error) => showStatus(String(error.message || error)))),
  );
  const title = document.createElement('h2');
  title.textContent = '下载任务（' + state.jobs.length + '）';
  view.append(back, title, tools);
  if (!state.jobs.length) {
    const empty = document.createElement('div');
    empty.className = 'spinner';
    empty.textContent = '还没有下载任务，去剧集详情点“下载全部”或播放页点“下载本集”。';
    view.appendChild(empty);
    return;
  }
  const list = document.createElement('div');
  list.className = 'jobs';
  for (const job of state.jobs) list.appendChild(jobRow(job));
  view.appendChild(list);
}

async function batch(command) {
  const ids = state.jobs.filter((job) => command === 'pause' ? job.state === 'queued' || job.state === 'downloading'
    : command === 'resume' ? job.state === 'paused' || job.state === 'failed'
    : job.state === 'completed').map((job) => job.id);
  if (!ids.length) { showStatus('没有符合条件的任务'); return; }
  try {
    const result = await call({ action:'controlDownloadBatch', command, jobIds:ids });
    await refreshDownloads();
    if (result && result.failures && Object.keys(result.failures).length) showStatus('部分任务失败：' + Object.values(result.failures)[0]);
  } catch (error) {
    showStatus('批量操作失败：' + (error.message || error));
  }
}

async function showProxy() {
  try {
    const info = await fetch('/api/info').then((response) => response.json());
    const proxy = info.proxy || {};
    proxyBadge.hidden = false;
    if (proxy.mode === 'manual') {
      proxyBadge.textContent = '代理 · ' + (proxy.url || '未填地址');
    } else if (proxy.mode === 'direct') {
      proxyBadge.textContent = '直连（不使用代理）';
    } else if (proxy.mode) {
      proxyBadge.textContent = '代理 · 自动（读取系统设置）';
    } else {
      proxyBadge.textContent = '代理 · 未设置';
    }
  } catch (error) {
    proxyBadge.hidden = true;
  }
}

document.getElementById('search').onclick = () => { state.query = queryInput.value.trim(); loadCatalog(false); };
queryInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') { state.query = queryInput.value.trim(); loadCatalog(false); } });
sourceSelect.onchange = () => { state.source = sourceSelect.value; loadCatalog(false); };
document.getElementById('home').onclick = () => { stopPlayback(); loadCatalog(false); };
document.getElementById('downloads-button').onclick = () => openDownloads();
document.getElementById('token-button').onclick = () => askToken();
document.getElementById('token-save').onclick = () => {
  localStorage.setItem('zgj-token', document.getElementById('token-input').value.trim());
  document.getElementById('token-dialog').close();
  start();
};
document.getElementById('token-clear').onclick = () => {
  localStorage.removeItem('zgj-token');
  document.getElementById('token-dialog').close();
  showStatus('已清除本机令牌');
};

async function start() {
  let info = {};
  try { info = await fetch('/api/info').then((response) => response.json()); } catch (error) {}
  authRequired = Boolean(info.authRequired);
  document.getElementById('token-button').hidden = !authRequired;
  if (authRequired && !token()) {
    view.innerHTML = '<div class="spinner">请先填写访问令牌</div>';
    askToken();
    return;
  }
  view.innerHTML = '<div class="spinner">加载中…</div>';
  try {
    await loadSources();
    await loadCatalog(false);
  } catch (error) {
    showStatus('初始化失败：' + (error.message || error));
  }
}

showProxy();
start();
</script>
</body>
</html>
