services:
  zhenguojian-core:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: zhenguojian-core:${IMAGE_TAG:-latest}
    container_name: zhenguojian-core
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      TOKEN: "${TOKEN:-}"
      MAX_CONCURRENCY: "${MAX_CONCURRENCY:-8}"
      TZ: "${TZ:-Asia/Shanghai}"
      PROXY_MODE: "${PROXY_MODE:-}"
      PROXY_URL: "${PROXY_URL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zhenguojian-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  zhenguojian-data:
